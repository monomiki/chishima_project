<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宿泊費 | 千島project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f8f7f3; --text: #202020; --line: #202020; --muted: #6b6b6b; --surface: #ffffff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans JP", "Noto Sans", sans-serif; font-weight: 400; line-height: 1.7; }
    a { color: inherit; text-decoration: none; }
    .page { width: min(880px, calc(100% - 32px)); margin: 0 auto; padding: 44px 0 72px; }
    .back { display: inline-block; margin-bottom: 44px; color: var(--muted); font-size: 14px; }
    h1 { margin: 0 0 32px; font-size: 36pt; font-weight: 400; line-height: 1.3; letter-spacing: 0; }
    .box { border: 2px solid var(--line); background: var(--surface); padding: 28px; }
    .cost-list { margin: 0; padding-left: 1.2em; }
    .cost-list li { margin-bottom: 10px; }
    .note { margin: 24px 0 0; color: var(--muted); }
    @media (max-width: 760px) { h1 { font-size: 34px; } }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← メインページへ戻る</a>
    <h1>宿泊費</h1>
    <div class="box">
      <ul class="cost-list">
        <li>wifi 協力金 300円（1滞在分）</li>
        <li>一泊 1500円</li>
        <li>2泊以降は 1000円</li>
        <li>上限 10000円</li>
        <li>連泊は基本1週間まで</li>
        <li>それ以上は長期滞在プラン</li>
      </ul>
      <p class="note">長期滞在や冊子送付数は、必要に応じて個別相談として扱います。</p>
    </div>
  </main>
</body>
</html>
