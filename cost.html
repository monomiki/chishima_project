<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>利用費 | 千島project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f8f7f3; --text: #202020; --line: #202020; --muted: #6b6b6b; --surface: #ffffff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans JP", "Noto Sans", sans-serif; font-weight: 400; line-height: 1.7; }
    a { color: inherit; text-decoration: none; }
    .page { width: min(880px, calc(100% - 32px)); margin: 0 auto; padding: 44px 0 72px; }
    .back { display: inline-block; margin-bottom: 44px; color: var(--muted); font-size: 14px; }
    h1 { margin: 0 0 32px; font-size: 36pt; font-weight: 400; line-height: 1.3; letter-spacing: 0; }
    .box { border: 2px solid var(--line); background: var(--surface); padding: 28px; }
    .price-table { width: 100%; border-collapse: collapse; margin: 0 0 24px; }
    .price-table th, .price-table td { border: 2px solid var(--line); padding: 14px; text-align: left; vertical-align: top; }
    .price-table th { background: var(--bg); font-weight: 400; }
    .price-table td:not(:first-child), .price-table th:not(:first-child) { text-align: center; }
    .small { display: block; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .note { margin: 24px 0 0; color: var(--muted); }
    @media (max-width: 760px) { h1 { font-size: 34px; } .price-table th, .price-table td { padding: 10px; font-size: 14px; } }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← メインページへ戻る</a>
    <h1>利用費</h1>
    <div class="box">
      <table class="price-table">
        <thead>
          <tr>
            <th>区分</th>
            <th>会員</th>
            <th>同行者<span class="small">1会員あたり5人まで同行可能</span></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>一泊あたり</td>
            <td>1500円</td>
            <td>1500円</td>
          </tr>
          <tr>
            <td>二泊目以降</td>
            <td>1000円</td>
            <td>1200円</td>
          </tr>
        </tbody>
      </table>
      <p>Wi-Fiを利用する場合は、1滞在あたり300円を協力金としていただきます。</p>
      <p>滞在は基本的に1週間までです。</p>
      <p class="note">それ以上の滞在は長期滞在プランとして、個別にご相談ください。</p>
    </div>
  </main>
</body>
</html>
