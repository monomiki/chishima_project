<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>千島維持プロジェクトについて | 千島project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f8f7f3; --text: #202020; --line: #202020; --muted: #6b6b6b; --surface: #ffffff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans JP", "Noto Sans", sans-serif; font-weight: 400; line-height: 1.8; }
    a { color: inherit; text-decoration: none; }
    .page { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 44px 0 72px; }
    .back { display: inline-block; margin-bottom: 44px; color: var(--muted); font-size: 14px; }
    h1 { margin: 0 0 32px; font-size: 36pt; font-weight: 400; line-height: 1.3; letter-spacing: 0; }
    .box { border: 2px solid var(--line); background: var(--surface); padding: 28px; }
    p { margin: 0 0 18px; }
    p:last-child { margin-bottom: 0; }
    .lead-image { display: block; width: 100%; height: auto; margin-bottom: 26px; border: 2px solid var(--line); }
    .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 28px; }
    .gallery img { display: block; width: 100%; height: 100%; min-height: 260px; border: 2px solid var(--line); object-fit: cover; }
    @media (max-width: 760px) { h1 { font-size: 34px; } .gallery { grid-template-columns: 1fr; } .gallery img { min-height: auto; } }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← メインページへ戻る</a>
    <h1>千島維持プロジェクトについて</h1>
    <div class="box">
      <img class="lead-image" src="assets/chishima-house.jpg" alt="佐渡島の羽茂地区にある千島の外観">
      <p>千島projectは、佐渡島の羽茂地区にある「千島」という屋号の家を、みんなで維持していくためのプロジェクトです。</p>
      <p>法人団体ガヤラボから場を引き継ぎ、現在は長島が中心となって維持管理をはじめています。</p>
      <p>島を知るための門戸をこれからも開いておけるように、この場所の維持に協力してくださる協賛者を求めています。</p>
      <div class="gallery" aria-label="千島の写真">
        <img src="assets/chishima-porch.jpg" alt="千島の縁側で過ごす人たち">
        <img src="assets/chishima-group.jpg" alt="千島の前に集まる人たち">
      </div>
    </div>
  </main>
</body>
</html>
