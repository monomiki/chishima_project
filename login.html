<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | 千島project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f8f7f3; --text: #202020; --line: #202020; --muted: #6b6b6b; --surface: #ffffff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans JP", "Noto Sans", sans-serif; font-weight: 400; line-height: 1.7; }
    a { color: inherit; text-decoration: none; }
    .page { width: min(680px, calc(100% - 32px)); margin: 0 auto; padding: 44px 0 72px; }
    .back { display: inline-block; margin-bottom: 44px; color: var(--muted); font-size: 14px; }
    h1 { margin: 0 0 32px; font-size: 36pt; font-weight: 400; line-height: 1.3; letter-spacing: 0; }
    .box { border: 2px solid var(--line); background: var(--surface); padding: 28px; }
    label { display: block; margin-bottom: 18px; }
    .label-text { display: block; margin-bottom: 8px; color: var(--muted); font-size: 14px; }
    input { width: 100%; border: 2px solid var(--line); background: var(--bg); padding: 12px; color: var(--text); font: inherit; }
    button { border: 2px solid var(--line); background: var(--bg); padding: 10px 18px; color: var(--text); font: inherit; cursor: default; }
    .note { margin: 20px 0 0; color: var(--muted); font-size: 14px; }
    @media (max-width: 760px) { h1 { font-size: 34px; } .box { padding: 20px; } }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← メインページへ戻る</a>
    <h1>ログイン</h1>
    <div class="box">
      <label>
        <span class="label-text">メールアドレス</span>
        <input type="email" name="email" autocomplete="email">
      </label>
      <label>
        <span class="label-text">パスワード</span>
        <input type="password" name="password" autocomplete="current-password">
      </label>
      <button type="button">ログイン（準備中）</button>
      <p class="note">会員向けページの準備用として置いている仮のログイン画面です。</p>
    </div>
  </main>
</body>
</html>
