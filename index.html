<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>千島project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f7f3;
      --text: #202020;
      --line: #202020;
      --muted: #6b6b6b;
      --surface: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans JP", "Noto Sans", sans-serif;
      font-weight: 400;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      display: grid;
      align-content: center;
      width: min(920px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 48px 0;
    }

    h1 {
      margin: 0 0 44px;
      font-size: 36pt;
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: 0;
      text-align: center;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu a {
      display: grid;
      place-items: center;
      min-height: 112px;
      border: 2px solid var(--line);
      background: var(--surface);
      padding: 18px;
      text-align: center;
      transition: background 160ms ease;
    }

    .menu a:hover {
      background: #eeeeea;
    }

    .note {
      margin: 32px 0 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 760px) {
      h1 {
        font-size: 34px;
      }

      .menu {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>千島project</h1>
    <nav aria-label="ページ一覧">
      <ul class="menu">
        <li><a href="about.html">千島維持プロジェクトについて</a></li>
        <li><a href="sponsor.html">支援プラン</a></li>
        <li><a href="reservation.html">予約ページ</a></li>
        <li><a href="cost.html">利用費</a></li>
      </ul>
    </nav>
    <p class="note">GitHub Pagesで公開できる、HTMLのみのシンプルな構成です。</p>
  </main>
</body>
</html>
